  # ---- Gmaps: dua sumber terpisah karena cadence-nya beda -------------
  # Nama/koordinat hotel pembanding BUKAN dari file ini: registry hotel dibaca
  # dari database (lihat hotel_master_schema/table di bawah). Tambah hotel di
  # tabel database itu, bukan di sources.yaml.
  #
  # headless: WAJIB false untuk kedua sumber. Google Maps tidak merender tab
  # "Ulasan" maupun daftar ulasan di Chromium headless; panel place hanya
  # muncul sebagai "Ringkasan / Harga / Tentang" sehingga hasil scrape selalu
  # 0 baris. Sudah diverifikasi dengan hotel yang jelas berulasan ribuan.
  # Node headful juga tidak seburuk itu: 1 worker = 1 proses Chromium, jadi
  # 5 worker = 5 jendela browser.

  gmaps_harga:
    # Nonaktif sementara: modul gmaps_harga_* belum ada, gmaps_review dulu yang
    # diverifikasi. Nyalakan lagi setelah src/extract/gmaps_harga_scraper.py ada.
    enabled: false
    headless: false
    grain: year
    playwright_required: true
    hotel_master_schema: "public"
    hotel_master_table: "hotel_master"
    # Tanggal check-in yang diambil tiap hotel (H+1..H+7, H+30, H+60).
    lead_times: [1, 2, 3, 4, 5, 6, 7, 30, 60]
    # Jumlah browser paralel. Sync API Playwright tidak thread-safe, jadi tiap
    # worker menjalankan playwright+browser sendiri (1 worker = 1 proses
    # Chromium). 5 worker memotong waktu run ~5x dibanding serial.
    harga_workers: 5
    blokir_gambar: true
    batas_detik_per_hotel: 420

  gmaps_review:
    # enabled: false = tidak ikut "jalan semua"; dipanggil manual per bulan
    # (`main.py gmaps_review`). Seed belum dihitung, jadi belum tentu lengkap.
    enabled: false
    headless: false
    grain: month
    playwright_required: true
    hotel_master_schema: "public"
    hotel_master_table: "hotel_master"
    max_reviews_per_hotel: 200
    review_workers: 2
    blokir_gambar: true
    # Batas waktu per hotel supaya satu hotel yang macet tidak menahan run
    # bulanan selama berjam-jam.
    batas_detik_per_hotel: 90

  transport:
    enabled: true
    period: latest
    grain: snapshot
    playwright_required: true

  poi:
    enabled: true
    period: latest
    grain: snapshot
    # query diproses serial (1) agar tidak menumbuk mirror Overpass publik;
    # naikkan bila mirror sanggup menangani lebih dari satu query serentak.
    overpass_workers: 1

  hari_libur:
    enabled: true
    period: latest
    grain: year

  kurs:
    enabled: true
    period: latest
    grain: year

  event:
    enabled: true
    period: latest
    grain: year
