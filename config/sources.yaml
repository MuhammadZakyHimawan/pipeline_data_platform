# Definisi sumber data pipeline.
# Periode default: "latest" = periode terbaru; backfill menyusul terpisah.
#
# Grain penamaan file bronze/silver (lihat src/shared/config.py):
#   year     -> satu file per tahun: {dataset}/{YYYY}.parquet
#   snapshot -> satu file penuh tanpa waktu: {dataset}/data.parquet
# Setiap file hanya berisi 1 tahun (atau 1 snapshot), jadi tidak ada tahun
# yang bisa muncul di dua file sekaligus.

defaults:
  period: latest
  timezone: Asia/Jakarta
  # Browser untuk sumber yang butuh Playwright. Pipeline umumnya headless,
  # tapi bisa di-override per sumber (misal saat butuh observasi/bypass captcha).
  headless: true
  # Gedung pencarian Moovit Jakarta (ganti bila perlu)
  moovit_url: "https://moovitapp.com/tripplan/jakarta-2044/lines/id?ref=16&customerId=4908"

sources:
  bps:
    enabled: true
    period: latest
    grain: year
    # start_year per dataset: tahun pertama yang ditarik; tahun tanpa data
    # dilewati (tidak ada file yang dibuat untuk tahun kosong).
    datasets:
      asal_turis:
        domain: "0000"
        var: "1470"
        start_year: 2014
      inflasi:
        domain: "0000"
        var: "1"
        start_year: 2014
      lama_menginap:
        domain: "3100"
        var: "233"
        start_year: 2014
      tpk_bintang:
        domain: "3100"
        var: "1186"
        start_year: 2014
      wisman_pintu_masuk:
        domain: "3100"
        var: "238"
        start_year: 2014
      wisnus_tujuan:
        domain: "3100"
        var: "1330"
        start_year: 2014

  gdelt:
    enabled: true
    period: latest
    grain: year
    # GDELT DOC API hanya mencakup ~2018 ke belakang.
    start_year: 2018

  cuaca:
    enabled: true
    period: latest
    grain: year

  trends:
    enabled: true
    period: latest
    grain: year
    playwright_required: true
    geo: ID
    # Optional: override rentang Trends (format "YYYY-MM-DD YYYY-MM-DD").
    # Default jika dikosongkan = 10 tahun terakhir s.d. hari ini.
    range: ""
    jeda_antar_destinasi: 20
    daftar_destinasi:
      - nama: "Bali"
        kategori: "Destinasi"
      - nama: "Lombok"
        kategori: "Destinasi"
      - nama: "Gili Trawangan"
        kategori: "Destinasi"
      - nama: "Yogyakarta"
        kategori: "Destinasi"
      - nama: "Borobudur"
        kategori: "Destinasi"
      - nama: "Prambanan"
        kategori: "Destinasi"
      - nama: "Bandung"
        kategori: "Destinasi"
      - nama: "Lembang"
        kategori: "Destinasi"
      - nama: "Pangandaran"
        kategori: "Destinasi"
      - nama: "Kota Tua Jakarta"
        kategori: "Destinasi"
      - nama: "Kepulauan Seribu"
        kategori: "Destinasi"
      - nama: "Ancol"
        kategori: "Destinasi"
      - nama: "Bogor"
        kategori: "Destinasi"
      - nama: "Puncak"
        kategori: "Destinasi"
      - nama: "Batu Malang"
