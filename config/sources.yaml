  # ---- Gmaps: harga (per hari) dan review (per bulan) -------------
  # Nama/koordinat hotel pembanding BUKAN dari file ini: registry hotel dibaca
  # dari database (lihat hotel_master_schema/table di bawah). Tambah hotel di
  # tabel database itu, bukan di sources.yaml.
  #
  # headless: true (server/CI mode). Jika hasil 0 baris, kembalikan ke false.

  gmaps:
    enabled: true
    headless: false
    grain: year
    playwright_required: true
    hotel_master_schema: "public"
    hotel_master_table: "hotel_master"
    # Tanggal check-in yang diambil tiap hotel (H+1..H+7, H+30, H+60).
    lead_times: [1, 2, 3, 4, 5, 6, 7, 30, 60]
    # Jumlah browser paralel. Sync API Playwright tidak thread-safe, jadi tiap
    # worker menjalankan playwright+browser sendiri (1 worker = 1 proses
    # Chromium). 5 worker memotong waktu run ~5x dibanding serial.
    harga_workers: 2
    blokir_gambar: true
    batas_detik_per_hotel: 420
    # Timeout navigation Google Travel (dalam ms). Halaman travel berat dan
    # `Page.goto` sering menggantung >30s, sehingga run lama hanya berisi
    # log timeout. Percobaan pertama sengaja pendek; percobaan terakhir
    # (posisi paling akhir) diberi kelonggaran agar tidak kehilangan semua
    # data saat Google sedang lambat.
    goto_timeout_ms: 2000
    goto_timeout_retry_ms: 4000
    wait_load_ms: 2000

  traveloka_review:
    enabled: true
    grain: month
    hotel_master_schema: "public"
    hotel_master_table: "hotel_master"
    max_pages_per_hotel: 50
    request_delay_seconds: 1.0
    timeout_seconds: 30

  transport:
    enabled: true
    period: latest
    grain: snapshot
    playwright_required: true

  poi:
    enabled: true
    period: latest
    grain: snapshot
    # query diproses serial (1) agar tidak menumbuk mirror Overpass publik;
    # naikkan bila mirror sanggup menangani lebih dari satu query serentak.
    overpass_workers: 1

  hari_libur:
    enabled: true
    period: latest
    grain: year

  kurs:
    enabled: true
    period: latest
    grain: year

  event:
    enabled: true
    period: latest
    grain: year
